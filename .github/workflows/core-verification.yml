name: Core verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportflow
          POSTGRES_PASSWORD: supportflow
          POSTGRES_DB: supportflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow -d supportflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUPPORTFLOW_DEBUG: "true"
      DATABASE_URL: sqlite:///./ci.db
      REDIS_URL: redis://127.0.0.1:6379/0
      LLM_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and workflow tests
        run: pytest -q
      - name: Deterministic agent evaluation
        run: python -m app.eval.run_eval
      - name: PostgreSQL refund concurrency proof
        env:
          TEST_DATABASE_URL: postgresql+psycopg://supportflow:supportflow@127.0.0.1:5432/supportflow_test
          CONC_THREADS: "16"
        run: pytest -q tests/test_concurrency.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
