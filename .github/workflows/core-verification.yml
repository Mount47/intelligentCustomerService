name: Core verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportflow
          POSTGRES_PASSWORD: supportflow
          POSTGRES_DB: supportflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow -d supportflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUPPORTFLOW_DEBUG: "true"
      DATABASE_URL: sqlite:///./ci.db
      REDIS_URL: redis://127.0.0.1:6379/0
      LLM_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Alembic migration smoke test
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: alembic upgrade head
      - name: Unit and workflow tests
        run: pytest -q
      - name: Deterministic agent evaluation
        run: python -m app.eval.run_eval
      - name: Real Redis and Celery end-to-end proof
        env:
          DATABASE_URL: postgresql+psycopg://supportflow:supportflow@127.0.0.1:5432/supportflow_test
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
          AGENT_DISPATCH: celery
          AUTH_SECRET: ci-integration-secret
          CHAT_RATE_LIMIT_PER_MIN: "10000"
          STUB_DELAY_MS: "20"
        run: |
          python -m scripts.seed_data
          celery -A app.workers.celery_app.celery_app worker \
            --loglevel=INFO --concurrency=2 > /tmp/supportflow-celery.log 2>&1 &
          CELERY_PID=$!
          uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/supportflow-api.log 2>&1 &
          API_PID=$!
          cleanup() {
            kill "$API_PID" "$CELERY_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          python -m scripts.e2e_real_infra \
            --worker-log /tmp/supportflow-celery.log || {
              tail -100 /tmp/supportflow-api.log
              tail -100 /tmp/supportflow-celery.log
              exit 1
            }
      # 可靠投递验收：API 的 broker 指向不可达地址，模拟"提交成功但入队失败"。
      # 消息必须不丢——relay 恢复后补投，且不产生重复处理。
      - name: Outbox reliable-delivery proof (broker outage)
        env:
          DATABASE_URL: postgresql+psycopg://supportflow:supportflow@127.0.0.1:5432/supportflow_test
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
          AGENT_DISPATCH: celery
          AUTH_SECRET: ci-integration-secret
          CHAT_RATE_LIMIT_PER_MIN: "10000"
          STUB_DELAY_MS: "20"
          OUTBOX_RELAY_DELAY_SEC: "1"
        run: |
          celery -A app.workers.celery_app.celery_app worker \
            --loglevel=INFO --concurrency=2 > /tmp/supportflow-celery-outbox.log 2>&1 &
          CELERY_PID=$!
          # API 单独起一份，broker 指向死端口：内联投递必然失败
          CELERY_BROKER_URL=redis://127.0.0.1:1/0 \
            uvicorn app.main:app --host 127.0.0.1 --port 8001 \
            > /tmp/supportflow-api-outbox.log 2>&1 &
          API_PID=$!
          cleanup() {
            kill "$API_PID" "$CELERY_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8001/health >/dev/null && break
            sleep 1
          done
          python -m scripts.e2e_outbox_recovery --base-url http://127.0.0.1:8001 || {
            tail -100 /tmp/supportflow-api-outbox.log
            tail -100 /tmp/supportflow-celery-outbox.log
            exit 1
          }
      - name: PostgreSQL refund concurrency proof
        env:
          TEST_DATABASE_URL: postgresql+psycopg://supportflow:supportflow@127.0.0.1:5432/supportflow_test
          CONC_THREADS: "16"
        run: pytest -q tests/test_concurrency.py
      - name: PostgreSQL message idempotency concurrency proof
        env:
          TEST_DATABASE_URL: postgresql+psycopg://supportflow:supportflow@127.0.0.1:5432/supportflow_test
          MESSAGE_CONC_THREADS: "16"
        run: pytest -q tests/test_message_idempotency_concurrency.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
